<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Тренажёр глубинного интервью: собери из карт гайд на 60 минут.">
<meta name="author" content="Безгласная Елена Алексеевна">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Сценарий за час</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: шапка с вопросом и счётчиком минут; ниже три колонки — библиотека карт · канвас этапов · кубик и чек-лист. На телефоне всё в одну колонку. */
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --sunk:#F4F6F8; --ink:#18212C; --muted:#5B6776; --line:#CBD3DC;
  --accent:#2C55C9; --accent-ink:#FFFFFF;
  --green:#2E8656; --green-soft:#E3F2E9; --yellow:#C99212; --yellow-soft:#FBF1D8; --red:#C2402C; --red-soft:#FBE6E2;
  --shadow:0 1px 2px rgba(24,33,44,.08),0 6px 18px rgba(24,33,44,.06);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161C; --surface:#1A212A; --sunk:#151B22; --ink:#E5EAF0; --muted:#98A4B3; --line:#2D3743;
  --accent:#86A3F5; --accent-ink:#0E1420;
  --green:#4DB57E; --green-soft:#183427; --yellow:#E6B843; --yellow-soft:#382D12; --red:#E86A55; --red-soft:#3B1D18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#1A212A; --sunk:#151B22; --ink:#E5EAF0; --muted:#98A4B3; --line:#2D3743;
  --accent:#86A3F5; --accent-ink:#0E1420;
  --green:#4DB57E; --green-soft:#183427; --yellow:#E6B843; --yellow-soft:#382D12; --red:#E86A55; --red-soft:#3B1D18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:9px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:13px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13px}

/* header */
header.top{display:grid;grid-template-columns:1fr auto;gap:16px 28px;align-items:end;padding-bottom:16px;border-bottom:1.5px solid var(--line)}
header.top h1{font-size:clamp(26px,4vw,40px)}
.rq{max-width:68ch;color:var(--muted);margin:6px 0 0}
.rq b{color:var(--ink);font-weight:600}
.meter{min-width:260px;display:flex;flex-direction:column;gap:6px}
.meter .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.meter .big{font-family:var(--f-mono);font-size:30px;line-height:1}
.bar{height:12px;border-radius:6px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .3s}
.bar .reserve{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--muted) 30%,transparent) 4px 6px)}
.meter.over .fill{background:var(--red)}

/* grid */
.board{display:grid;grid-template-columns:290px minmax(0,1fr) 270px;gap:20px;align-items:start}
@media (max-width:1080px){.board{grid-template-columns:minmax(0,1fr)}.side{order:-2}.lib{order:-1}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:12px}
@media (max-width:1080px){.side{position:static}}

/* library */
.lib .cards{display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow:auto;padding-right:2px}
@media (max-width:1080px){.lib .cards{max-height:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
.card{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;width:100%}
.card .hd{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;font-family:var(--f-body);font-weight:600;font-size:12px;color:#fff}
.card.green .hd{background:var(--green)} .card.yellow .hd{background:var(--yellow);color:#241a00} .card.red .hd{background:var(--red)}
:root[data-theme="dark"] .card.yellow .hd{color:#1d1500}
.card .bd{padding:8px 10px 10px;font-size:14px;line-height:1.4}
.card .tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.tag.on{border-color:var(--accent);color:var(--accent)}
button.card:not(:disabled):hover{border-color:var(--ink);transform:translateY(-1px)}
button.card{transition:transform .15s,border-color .15s}
.lib .empty{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:3px 10px;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* canvas */
.canvas{display:flex;flex-direction:column;gap:14px;min-width:0}
.stage{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.stage.locked{background:transparent;border-style:dashed;color:var(--muted)}
.stage.active{border-color:var(--ink)}
.stage .sh{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.stage h3{font-size:16px}
.stage .need{font-size:13px;color:var(--muted)}
.stage .need.ok{color:var(--green)}
.q{border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:8px 10px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start}
.q .id{font-weight:600;font-size:12px;color:var(--green);padding-top:2px}
.q.case .id{color:var(--red)}
.q.off{border-color:var(--red);background:var(--red-soft)}
.q .txt{min-width:0;overflow-wrap:anywhere}
.q .min{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.q .probes{grid-column:2/4;display:flex;flex-direction:column;gap:4px}
.probe{font-size:13px;border-left:3px solid var(--yellow);padding:2px 8px;background:var(--yellow-soft);border-radius:0 6px 6px 0;overflow-wrap:anywhere}
.q .acts{grid-column:2/4;display:flex;gap:14px;flex-wrap:wrap}
.consent{border:1.5px solid var(--green);background:var(--green-soft)}
.hyp{border:1.5px dashed var(--ink);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.hyp .front{font-weight:600}
.hyp .back{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.hyp .back b{color:var(--ink)}
.locknote{font-size:14px}
.nexthint{font-size:14px;background:var(--sunk);border-radius:8px;padding:8px 12px}
.nexthint b{font-weight:600}

/* dice */
.diebox{display:flex;align-items:center;gap:16px}
.die{width:72px;height:72px;border-radius:14px;background:var(--surface);border:2px solid var(--ink);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:10px;flex:none;box-shadow:var(--shadow)}
.die i{width:12px;height:12px;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.die.even i.on{background:var(--red)}
.die.rolling{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-8deg) translateY(-2px)}50%{transform:rotate(7deg) translateY(1px)}100%{transform:rotate(-8deg) translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.die.rolling{animation:none}button.card{transition:none}}
.verdict{font-size:14px}
.verdict b{font-family:var(--f-display);font-weight:500}
.deckinfo{font-size:13px;color:var(--muted)}

/* checklist */
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks li{display:grid;grid-template-columns:20px 1fr;gap:6px;align-items:start}
.checks .mk{font-family:var(--f-mono);font-weight:600}
.checks .ok .mk{color:var(--green)} .checks .no .mk{color:var(--muted)}
.checks .no{color:var(--muted)}

/* modal */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:14px;max-width:620px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);border-top:8px solid var(--line)}
.modal.green{border-top-color:var(--green)} .modal.yellow{border-top-color:var(--yellow)} .modal.red{border-top-color:var(--red)} .modal.ink{border-top-color:var(--ink)}
.modal h2{font-size:20px}
.formula{font-size:17px;font-weight:500}
textarea{width:100%;min-height:84px;border:1.5px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:var(--sunk);color:var(--ink);resize:vertical}
textarea:focus{border-color:var(--accent);outline:none}
.selfcheck{display:flex;flex-direction:column;gap:6px}
.selfcheck label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);margin-top:1px;flex:none}
.etalon{background:var(--green-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.etalon.redbg{background:var(--red-soft)}
.mfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--sunk);border-radius:8px;padding:10px 12px;text-align:left}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt.picked{border-color:var(--ink);background:var(--surface)}
.opt .mark{font-family:var(--f-mono);font-weight:600;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--yellow);background:var(--yellow-soft);border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--yellow);color:#241a00}

/* intro & result */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px}
@media (max-width:800px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero p{max-width:60ch;margin:0}
.levels{display:flex;flex-direction:column;gap:8px}
.lvl{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.lvl.on{border-color:var(--ink)}
.lvl .st{font-size:12px;color:var(--muted);white-space:nowrap}
.fan{display:flex;justify-content:center;padding:10px 0}
.fan .card{width:150px;flex:none;box-shadow:var(--shadow)}
.fan .card:nth-child(1){transform:rotate(-8deg) translateX(24px)}
.fan .card:nth-child(2){transform:translateY(-10px);z-index:1}
.fan .card:nth-child(3){transform:rotate(8deg) translateX(-24px)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pr{font-size:12px;font-weight:600;white-space:nowrap}
.pr.must{color:var(--green)} .pr.can{color:var(--muted)} .pr.cut{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60}
.demobar{display:flex;justify-content:space-between;gap:10px 16px;align-items:center;flex-wrap:wrap;background:var(--yellow-soft);border:1.5px solid var(--yellow);border-radius:10px;padding:10px 14px;font-size:14px}
.tour-hl{outline:3px solid var(--accent);outline-offset:4px;border-radius:10px;position:relative;z-index:30}
.tour{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));background:var(--surface);border:1.5px solid var(--ink);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);z-index:55;display:flex;flex-direction:column;gap:8px}
.tour h3{font-size:17px}.tour p{margin:0;font-size:14px}
.foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.foot a{color:var(--muted)}
.copyfall{width:100%;min-height:140px;font-family:var(--f-mono);font-size:12px}
</style>
</head>
<body>


<div class="wrap" id="app"></div>
<div id="modalRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===================== ДАННЫЕ ===================== */
const CASE = {
  title:'Посты с фото ВКонтакте',
  rq:'Почему пользователи ВКонтакте выбирают историю, а не пост, когда публикуют личные фото?'
};
const CONSENT_ITEMS = [
  'Объяснил цель интервью и сколько оно займёт',
  'Спросил разрешение на запись',
  'Сказал, что ответы останутся анонимными',
  'Сказал, что можно не отвечать на вопрос или остановить интервью в любой момент'
];
const CONSENT_TEXT = 'Разговор займёт около часа. Можно мы запишем его? Запись нужна только для расшифровки и анализа, её не передают третьим лицам, а ваше имя не будет в отчёте. Вы можете не отвечать на любой вопрос и остановить разговор в любой момент. Есть ли у вас вопросы, прежде чем мы начнём?';

const HYP = {
  'Г1':{front:'Личные фото уходят в истории, потому что там можно выбрать, кто увидит.',link:'контроль аудитории → выбор формата',fact:'~1 млн человек в день публикуют истории для близких (VK Press)',yes:'Выбирает историю или личные сообщения и объясняет это тем, кто увидит: «только для своих».',no:'Выбор объясняет скоростью, тем, что история исчезает, привычкой.'},
  'Г2':{front:'От поста отказываются, потому что друзья не увидят его в ленте.',link:'ожидание охвата → отказ от публикации',fact:'~5,5% отзывов в RuStore о ленте: реклама, чужой контент',yes:'Говорит, что пост «теряется», «никто не видит», и связывает с этим отказ.',no:'Уверен, что друзья видят посты, а отказывается по другим причинам.'},
  'Г3':{front:'От поста отказываются из-за обрезки или потери качества фото.',link:'работа редактора → отказ от публикации',fact:'~12,5% отзывов в RuStore о загрузке фото',yes:'Жалобы на обрезку или качество, остановки в задании, рассказы о брошенных постах.',no:'Задание проходит без затруднений.'}
};

const STAGES = [
  {id:'intro',name:'Знакомство',group:'З',min:2,max:4,mins:2,note:'согласие + 2 вопроса'},
  {id:'vvod', name:'Вводные',group:'В',min:2,max:4,mins:3,note:'2 вопроса'},
  {id:'h1',name:'Цепочка Г1',group:'К',hyp:'Г1',min:2,max:3,mins:5},
  {id:'h2',name:'Цепочка Г2',group:'К',hyp:'Г2',min:2,max:3,mins:5},
  {id:'h3',name:'Цепочка Г3',group:'К',hyp:'Г3',min:2,max:3,mins:5},
  {id:'fin',name:'Заключение',group:'Зк',min:1,max:2,mins:2,note:'1 вопрос'}
];

const STD_CHECKS = ['Вопрос открытый','Без подсказки ответа','Про реальный случай, а не «как обычно»'];
const GREEN = [
  {id:'З1',g:'З',min:2,f:'«Расскажите немного о себе: [чем занимаетесь]…»',e:'«Расскажите немного о себе: чем занимаетесь, как обычно проходит ваш день?»',w:'Разогрев. Заодно сверяем профессию: маркетологов и SMM-специалистов не интервьюируем.',checks:['Вопрос открытый','Лёгкий, без давления','Помогает сверить профиль респондента']},
  {id:'З2',g:'З',min:2,f:'«Чем любите заниматься в [свободное время]?»',e:'«Чем любите заниматься в свободное время?»',w:'Образ жизни нужен для кросс-анализа ответов.',checks:['Вопрос открытый','Лёгкий, без давления','Не уводит в тему исследования раньше времени']},
  {id:'З3',g:'З',min:2,f:'«Как давно вы пользуетесь [продуктом]?»',e:'«Как давно вы пользуетесь ВКонтакте? С чего начинали?»',w:'Стаж объясняет привычки.',checks:['Есть открытое продолжение','Без подсказки ответа','Про реальный опыт']},
  {id:'З4',g:'З',min:2,cut:true,f:'Отсекающий: «[Делали ли вы действие] за последние [N] месяцев?»',e:'«Публиковали ли вы что-нибудь во ВКонтакте за последние 3 месяца: пост, историю или клип?»',w:'Единственный допустимый закрытый вопрос. «Нет» → поблагодарить и завершить.',checks:['Нужен только для отсева','Понятно, что делать при ответе «нет»','Период указан конкретно']},
  {id:'В1',g:'В',min:3,f:'«Расскажите, как вы пользуетесь [продуктом]. Для чего заходите?»',e:'«Расскажите, как вы пользуетесь ВКонтакте. Для чего вы туда заходите?»',w:'Широкий вход в тему, респондент говорит своими словами.'},

const KEY='szch-level1-v1';
function fresh(){return{screen:'intro',consent:[false,false,false,false],consentDone:false,opened:1,active:'intro',rolls:{},pendingCase:null,deck:shuffle(CASES.map(c=>c.id)),limit:60,k7req:false,consentExtra:[],items:[],flipped:{},caseLog:[]}}
let S=load()||fresh();
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){if(S.demo)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function rnd(n){try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}catch(e){return Math.floor(Math.random()*n)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stage=id=>STAGES.find(s=>s.id===id);
const stageIdx=id=>STAGES.findIndex(s=>s.id===id);
const green=id=>GREEN.find(c=>c.id===id);
const probe=id=>PROBES.find(c=>c.id===id);
const caseC=id=>CASES.find(c=>c.id===id);

/* ===================== РАСЧЁТЫ ===================== */
function itemMins(it){return it.min+(it.probes?it.probes.length:0)}
function total(){return 2+S.items.reduce((a,it)=>a+itemMins(it),0)} // 2 = согласие
function stageItems(id){return S.items.filter(it=>it.stage===id)}
function realItems(id){return stageItems(id).filter(it=>!it.off)}
function need(st){return st.hyp && S.limit===45?1:st.min}
function stageMet(st){
  const q=realItems(st.id);
  if(st.hyp) return q.length>=need(st)&&q.every(it=>it.probes.length>=1)&&(st.id!=='h2'||!S.k7req||q.some(it=>it.card==='К7'));
  return q.length>=st.min;
}
function usedIds(){const u=new Set();S.items.forEach(it=>{if(it.card)u.add(it.card);(it.probes||[]).forEach(p=>u.add(p.card))});return u}
function rolledOK(id){const r=S.rolls[id];return r!==undefined && !S.pendingCase}
function canAddTo(st){
  if(stageIdx(st.id)>=S.opened) return false;
  if(!rolledOK(st.id)) return false;
  return realItems(st.id).length<st.max;
}
function checklist(){
  const chains=STAGES.filter(s=>s.hyp);
  const L=[
    {t:'Согласие получено',ok:S.consentDone},
    {t:S.limit===45?'Каждая гипотеза покрыта 1 вопросом':'Каждая гипотеза покрыта 2 вопросами',ok:chains.every(s=>stageIdx(s.id)<S.opened&&realItems(s.id).length>=need(s))},
    {t:'У каждого ключевого вопроса есть проба',ok:chains.every(s=>realItems(s.id).every(it=>it.probes.length>=1))&&chains.some(s=>realItems(s.id).length)},
    {t:'Есть заключение',ok:realItems('fin').length>=1},
    {t:'Есть резерв 5 минут',ok:total()<=S.limit-5},
    {t:'Нет вопросов вне цели',ok:!S.items.some(it=>it.off)},
    {t:'Все вопросы прошли самопроверку',ok:S.items.length>0}
  ];
  if(S.k7req)L.splice(2,0,{t:'В цепочке Г2 есть вопрос К7 (сегмент «перестали публиковать»)',ok:realItems('h2').some(it=>it.card==='К7')});
  return L;
}

  app.innerHTML=`${demoBar()}
  <header class="top">
    <div><div class="eyebrow">Уровень 1 · ${esc(CASE.title)}</div><h1>Сценарий за час</h1>
      <p class="rq">Исследовательский вопрос: <b>${esc(CASE.rq)}</b></p></div>
    <div class="meter ${t>lim?'over':''}" aria-live="polite">
      <div class="row"><span class="eyebrow">Сценарий</span><span><span class="big">${t}</span><span class="mono" style="color:var(--muted)"> / ${lim} мин</span></span></div>
      <div class="bar"><div class="reserve" style="left:${(lim-5)/lim*100}%;right:0"></div><div class="fill" style="width:${pct}%"></div></div>
      <div class="row" style="font-size:12px;color:var(--muted)"><span>штриховка: резерв 5 мин</span><button class="linkbtn" id="restart">Начать заново</button></div>
    </div>
  </header>
  <div class="board">
    <aside class="panel lib" aria-label="Библиотека карт">${libHTML()}</aside>
    <main class="canvas" aria-label="Канвас">${STAGES.map(stageHTML).join('')}</main>
    <aside class="side">
      <div class="panel">${diceHTML(cur)}</div>
      <div class="panel"><div class="eyebrow">Чек-лист гайда</div><ul class="checks">${checklist().map(c=>`<li class="${c.ok?'ok':'no'}"><span class="mk">${c.ok?'✓':'·'}</span><span>${esc(c.t)}</span></li>`).join('')}</ul>
        <button class="btn accent" id="build" ${checklist().every(c=>c.ok)&&S.opened===STAGES.length?'':'disabled'}>Собрать гайд</button></div>

function libHTML(){
  const st=stage(S.active);const used=usedIds();
  let list=GREEN.filter(c=>c.g===st.group);
  if(st.hyp) list=list.filter(c=>c.h.includes(st.hyp));
  const can=canAddTo(st);
  let why='';
  if(stageIdx(st.id)>=S.opened) why='Этап ещё закрыт.';
  else if(S.rolls[st.id]===undefined) why='Сначала бросьте кубик.';
  else if(S.pendingCase) why='Сначала разыграйте карту случая.';
  else if(!can) why='В этапе максимум вопросов.';
  return `<div class="eyebrow">Библиотека · этап</div>
  <div class="tabs" role="group" aria-label="Этап">${STAGES.slice(0,S.opened).map(s=>`<button data-tab="${s.id}" aria-pressed="${s.id===S.active}">${esc(s.name)}</button>`).join('')}</div>
  ${why?`<div class="lib empty">${why}</div>`:''}
  <div class="cards">${list.map(c=>{const u=used.has(c.id);return `<button class="card green" data-card="${c.id}" ${u||!can?'disabled':''} aria-label="Карта ${c.id}"><div class="hd"><span>${c.id}${u?' · сыграна':''}</span><span>${c.min} мин</span></div><div class="bd">${esc(c.f)}${c.h?`<div class="tags">${c.h.map(h=>`<span class="tag ${h===st.hyp?'on':''}">${h}</span>`).join('')}</div>`:''}</div></button>`}).join('')||'<div class="empty">Нет карт для этапа</div>'}</div>`;
}

function stageHTML(st,i){
  if(i>=S.opened) return `<section class="stage locked"><div class="sh"><h3>${esc(st.name)}</h3><span class="need">закрыт</span></div></section>`;
  const items=stageItems(st.id);const met=stageMet(st);const isCur=i===S.opened-1;
  const n=need(st);
  const needTxt=st.hyp?`${realItems(st.id).length} из ${n} вопр., у каждого проба${st.id==='h2'&&S.k7req?', нужен К7':''}`:`${realItems(st.id).length} из ${st.min} вопр.`;
  let h='';
  if(st.hyp){const H=HYP[st.hyp];const f=S.flipped[st.hyp];
    h=`<div class="hyp"><div class="eyebrow">${st.hyp} · связь: ${esc(H.link)}</div><div class="front">${esc(H.front)}</div>
    ${f?`<div class="back"><span><b>Откуда гипотеза:</b> ${esc(H.fact)}</span><span><b>Подтвердит:</b> ${esc(H.yes)}</span><span><b>Опровергнет:</b> ${esc(H.no)}</span></div>`:''}
    <button class="linkbtn" data-flip="${st.hyp}" style="align-self:flex-start">${f?'Перевернуть обратно':'Перевернуть карту: откуда гипотеза'}</button></div>`}
  const consent=st.id==='intro'?`<div class="q consent"><span class="id">✓</span><span class="txt"><b>Согласие и запись.</b> ${esc(CONSENT_TEXT)}${S.consentExtra.length?' '+S.consentExtra.map(esc).join('. ')+'.':''}</span><span class="min">2 мин</span></div>`:'';
  return `<section class="stage ${st.id===S.active?'active':''}" data-stage="${st.id}">
    <div class="sh"><h3>${i+1}. ${esc(st.name)}</h3><span class="need ${met?'ok':''}">${met?'✓ ':''}${needTxt}</span></div>
    ${h}${consent}
    ${items.map(it=>qHTML(it,st)).join('')}
    ${nextStep(st,i,met,isCur)}
  </section>`;
}
function nextStep(st,i,met,isCur){
  const rolled=S.rolls[st.id]!==undefined;
  const q=realItems(st.id);const n=need(st);
  let hint='',btns='';
  if(!rolled){hint='Начните этап: бросьте кубик. Нечет — спокойно, чёт — карта случая.';btns=`<button class="btn accent small" data-rollhere>Бросить кубик</button>`}
  else if(S.pendingCase&&isCur){hint='Выпал чёт. Разыграйте карту случая.';btns=`<button class="btn small" data-case style="background:var(--red);border-color:var(--red);color:#fff">Открыть случай</button>`}
  else{
    if(q.length<n) hint=`Добавьте ещё ${n-q.length} ${n-q.length===1?'вопрос':'вопроса'}: выберите карту-формулу.`;
    else if(st.hyp&&q.some(it=>!it.probes.length)) hint='Прикрепите пробу к каждому ключевому вопросу: ссылка «+ проба» под вопросом.';
    else if(st.id==='h2'&&S.k7req&&!q.some(it=>it.card==='К7')) hint='Вводная заказчика: в этой цепочке нужен вопрос К7.';
    else if(isCur&&i<STAGES.length-1) hint='Минимум собран. Можно добавить ещё вопрос или открыть следующий этап.';
    else if(isCur) hint='Заключение собрано. Проверьте чек-лист справа и соберите гайд.';
    if(canAddTo(st)) btns+=`<button class="btn ghost small" data-add="${st.id}">+ Добавить вопрос</button>`;
    if(isCur&&i<STAGES.length-1) btns+=`<button class="btn small" data-next ${met?'':'disabled'}>Открыть следующий этап</button>`;
    if(isCur&&i===STAGES.length-1&&met) btns+=`<button class="btn accent small" data-tobuild>К чек-листу</button>`;
  }
  if(!isCur&&met&&rolled) hint='';
  return `${hint?`<div class="nexthint"><b>Что дальше:</b> ${hint}</div>`:''}<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">${btns}</div>`;
}
function qHTML(it,st){
  const isKey=!!st.hyp&&!it.off;
  return `<div class="q ${it.case?'case':''} ${it.off?'off':''}">
    <span class="id">${esc(it.card||it.case||'!')}</span><span class="txt">${esc(it.text)}${it.off?'<br><small style="color:var(--red)">Вопрос вне цели исследования</small>':''}</span><span class="min">${itemMins(it)} мин</span>
    ${it.probes&&it.probes.length?`<div class="probes">${it.probes.map((p,k)=>`<div class="probe"><b>${p.card}</b> ${esc(p.text)}</div>`).join('')}</div>`:''}
    <div class="acts">${isKey&&it.probes.length<2?`<button class="linkbtn" data-probe="${it.uid}">+ проба (1 мин)</button>`:''}<button class="linkbtn" style="color:var(--muted)" data-del="${it.uid}">Убрать</button></div>
  </div>`;
}
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dieFaces(v){return Array.from({length:9},(_,k)=>`<i class="${v&&PIPS[v].includes(k)?'on':''}"></i>`).join('')}
function diceHTML(cur){
  const r=S.rolls[cur.id];
  let v='';
  if(r===undefined) v=`<div class="verdict">Этап «${esc(cur.name)}». Бросьте кубик, чтобы начать.</div>`;
  else if(r%2) v=`<div class="verdict"><b>Нечет.</b> Этап спокойный, собирайте вопросы.</div>`;
  else v=`<div class="verdict"><b>Чёт.</b> ${S.pendingCase?'Разыграйте карту случая.':'Случай разыгран.'}</div>`;
  const left=S.deck.length;
  return `<div class="eyebrow">Кубик · случай</div>
  <div class="diebox"><div class="die ${r!==undefined&&r%2===0?'even':''}" id="die" aria-label="${r?'Выпало '+r:'Кубик не брошен'}">${dieFaces(r)}</div>
  <div style="display:flex;flex-direction:column;gap:8px">${r===undefined?'<button class="btn accent" id="roll">Бросить кубик</button>':S.pendingCase?'<button class="btn" id="opencase" style="background:var(--red);border-color:var(--red);color:#fff">Открыть случай</button>':''}
  <span class="deckinfo">Нечет: спокойно · чёт: карта случая<br>В колоде случаев: ${left}</span></div></div>${v}`;
}

function bindGame(){
  bindDemoBar();
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.active=b.dataset.tab;render()});
  app.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>openCompose(b.dataset.card));
  app.querySelectorAll('[data-flip]').forEach(b=>b.onclick=()=>{S.flipped[b.dataset.flip]=!S.flipped[b.dataset.flip];render()});
  app.querySelectorAll('[data-probe]').forEach(b=>b.onclick=()=>openProbe(b.dataset.probe));
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.items=S.items.filter(it=>it.uid!==b.dataset.del);render()});
  const nx=app.querySelector('[data-next]');if(nx)nx.onclick=()=>{S.opened++;const st=STAGES[S.opened-1];S.active=st.id;if(st.hyp)S.flipped[st.hyp]=false;render()};
  const r=document.getElementById('roll');if(r)r.onclick=roll;
  app.querySelectorAll('[data-rollhere]').forEach(b=>b.onclick=()=>{b.disabled=true;roll()});
  app.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openCase(S.pendingCase));
  app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{S.active=b.dataset.add;openPicker(b.dataset.add)});
  app.querySelectorAll('[data-tobuild]').forEach(b=>b.onclick=()=>{const bd=document.getElementById('build');bd&&bd.scrollIntoView({behavior:'smooth',block:'center'});bd&&bd.focus()});
  const oc=document.getElementById('opencase');if(oc)oc.onclick=()=>openCase(S.pendingCase);
  document.getElementById('restart').onclick=confirmRestart;
  const bd=document.getElementById('build');if(bd)bd.onclick=()=>{S.screen='guide';render();window.scrollTo(0,0)};
}

/* ===================== КУБИК ===================== */
function roll(){
  const cur=STAGES[S.opened-1];const die=document.getElementById('die');const btn=document.getElementById('roll');if(btn)btn.disabled=true;toast('Кубик брошен…');
  const final=rnd(6)+1;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finish=()=>{S.rolls[cur.id]=final;if(final%2===0&&S.deck.length){S.pendingCase=S.deck.shift();render();setTimeout(()=>openCase(S.pendingCase),350)}else render()};
  if(reduce||!die){finish();return}
  die.classList.add('rolling');let n=0;
  const iv=setInterval(()=>{die.innerHTML=dieFaces(rnd(6)+1);if(++n>8){clearInterval(iv);die.classList.remove('rolling');die.innerHTML=dieFaces(final);setTimeout(finish,250)}},80);
}

const mroot=document.getElementById('modalRoot');let lastFocus=null;
function openModal(html,cls,onMount){lastFocus=document.activeElement;mroot.innerHTML=`<div class="overlay" role="dialog" aria-modal="true"><div class="modal ${cls}">${html}</div></div>`;const ov=mroot.firstChild;ov.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ov.dataset.lock)closeModal()});onMount&&onMount(ov);const f=ov.querySelector('textarea,button,input');f&&f.focus()}
function closeModal(){mroot.innerHTML='';lastFocus&&lastFocus.focus&&lastFocus.focus()}
let uidN=Date.now();const uid=()=>'i'+(uidN++).toString(36);

function selfChecks(list){return `<div class="selfcheck"><div class="eyebrow">Самопроверка</div>${list.map((t,k)=>`<label><input type="checkbox" id="sc${k}">${esc(t)}</label>`).join('')}</div>`}

function openConsent(){
  openModal(`<div class="eyebrow">Карта «Согласие и запись» · 2 мин</div><h2>Сначала согласие</h2>
  <p style="margin:0">Исследование начинается только после информированного согласия. Отметьте всё, что вы скажете респонденту.</p>
  <div class="etalon"><div class="eyebrow">Как это звучит</div>${esc(CONSENT_TEXT)}</div>
  <div class="selfcheck">${CONSENT_ITEMS.map((t,k)=>`<label><input type="checkbox" id="cs${k}" ${S.consent[k]?'checked':''}>${esc(t)}</label>`).join('')}</div>
  <div class="mfoot"><button class="btn accent" id="cgo" disabled>Начать интервью</button></div>`,'green',ov=>{
    ov.dataset.lock='1';
    const upd=()=>{S.consent=CONSENT_ITEMS.map((_,k)=>ov.querySelector('#cs'+k).checked);ov.querySelector('#cgo').disabled=!S.consent.every(Boolean)};
    ov.querySelectorAll('input').forEach(i=>i.onchange=upd);upd();
    ov.querySelector('#cgo').onclick=()=>{S.consentDone=true;closeModal();render();toast('Канвас открыт. Бросьте кубик для этапа «Знакомство»')};
  });
}

function openCompose(id){
  const c=green(id);const st=stage(S.active);
  const left=S.limit-total();
  const checks=(c.checks||STD_CHECKS).concat(st.hyp?[`Проверяет гипотезу ${st.hyp}`]:[]);
  openModal(`<div class="eyebrow">${c.id} · ${esc(st.name)} · ${c.min} мин</div>
  <div class="formula">${esc(c.f)}</div>
  ${c.min>left?`<div class="etalon redbg">Карта не помещается: осталось ${left} мин из ${S.limit}. Уберите вопрос с канваса или выберите другую карту.</div>`:''}
  <label for="qt" class="eyebrow">Ваш вопрос для кейса</label>
  <textarea id="qt" placeholder="Напишите вопрос так, как скажете его респонденту"></textarea>
  ${selfChecks(checks)}
  <div id="et" hidden class="etalon"><div class="eyebrow">Эталон</div><div>${esc(c.e)}</div><div style="color:var(--muted);font-size:14px"><b>Почему так:</b> ${esc(c.w)}</div></div>
  <div class="mfoot"><button class="btn ghost" id="cx">Отмена</button><button class="btn ghost" id="show">Открыть эталон</button><button class="btn accent" id="put" disabled>Положить на канвас</button></div>`,'green',ov=>{
    const ta=ov.querySelector('#qt'),put=ov.querySelector('#put');let seen=false;
    const upd=()=>{put.disabled=!(ta.value.trim()&&seen&&checks.every((_,k)=>ov.querySelector('#sc'+k).checked)&&c.min<=left)};
    ta.oninput=upd;ov.querySelectorAll('input').forEach(i=>i.onchange=upd);
    ov.querySelector('#show').onclick=e=>{seen=true;ov.querySelector('#et').hidden=false;e.target.hidden=true;upd()};
    ov.querySelector('#cx').onclick=closeModal;
    put.onclick=()=>{S.items.push({uid:uid(),stage:st.id,card:c.id,text:ta.value.trim(),min:c.min,hyp:st.hyp||'',probes:[],cut:!!c.cut});closeModal();render()};
    put.title='Нужны: текст вопроса, все галочки самопроверки и открытый эталон';
  });
}

function openPicker(stId){
  const st=stage(stId);const used=usedIds();
  let list=GREEN.filter(c=>c.g===st.group);if(st.hyp)list=list.filter(c=>c.h.includes(st.hyp));
  openModal(`<div class="eyebrow">${esc(st.name)} · выберите карту-формулу</div><h2>Какой вопрос задать?</h2>
  <div class="opts">${list.map(c=>`<button class="opt" data-pick="${c.id}" ${used.has(c.id)?'disabled':''}><b>${c.id}</b> · ${c.min} мин${used.has(c.id)?' · сыграна':''}<br>${esc(c.f)}</button>`).join('')}</div>
  <div class="mfoot"><button class="btn ghost" id="cx">Отмена</button></div>`,'green',ov=>{
    ov.querySelector('#cx').onclick=closeModal;
    ov.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{closeModal();openCompose(b.dataset.pick)});
  });
}
function openProbe(itemUid){

  openModal(`<div class="eyebrow">Проба · 1 мин</div><h2>Как вы уточните ответ?</h2>
  <div class="etalon" style="background:var(--sunk)"><div class="eyebrow">Вопрос</div>${esc(it.text)}</div>
  <div class="chips" role="group" aria-label="Пробы">${PROBES.map(p=>`<button class="chip" data-p="${p.id}" aria-pressed="false" ${used.has(p.id)?'disabled':''}>${p.id} ${esc(p.n)}</button>`).join('')}</div>
  <div id="pinfo" class="etalon" style="background:var(--yellow-soft)" hidden></div>

    put.onclick=()=>{it.probes.push({card:sel,text:ta.value.trim()});closeModal();render()};
  });
}

function openCase(id){

    const mins=st.mins;

    <label for="qt" class="eyebrow">Ваша версия</label><textarea id="qt"></textarea>
    ${selfChecks(STD_CHECKS)}
    <div id="et" hidden class="etalon"><div class="eyebrow">Эталон исправления</div><div>${esc(c.e)}</div><div style="color:var(--muted);font-size:14px"><b>Разбор:</b> ${esc(c.w)}</div></div>
    <div class="mfoot"><button class="btn ghost" id="show">Открыть разбор</button><button class="btn accent" id="put" disabled>Положить в этап</button></div>`,'red',ov=>{
      ov.dataset.lock='1';const ta=ov.querySelector('#qt'),put=ov.querySelector('#put');let seen=false;
      const upd=()=>{put.disabled=!(ta.value.trim()&&seen&&STD_CHECKS.every((_,k)=>ov.querySelector('#sc'+k).checked))};
      ta.oninput=upd;ov.querySelectorAll('input').forEach(i=>i.onchange=upd);
      ov.querySelector('#show').onclick=e=>{seen=true;ov.querySelector('#et').hidden=false;e.target.hidden=true;upd()};
      put.onclick=()=>{S.items.push({uid:uid(),stage:st.id,case:c.id,text:ta.value.trim(),min:mins,hyp:st.hyp||'',probes:[]});S.pendingCase=null;S.caseLog.push(c.id);closeModal();render()};
    });

          S.pendingCase=null;S.caseLog.push(c.id);closeModal();render();
        };
      });
    });
  }
}

function confirmRestart(){
  openModal(`<h2>Начать заново?</h2><p style="margin:0">Собранный канвас удалится.</p><div class="mfoot"><button class="btn ghost" id="cx">Отмена</button><button class="btn" id="yes">Начать заново</button></div>`,'ink',ov=>{
    ov.querySelector('#cx').onclick=closeModal;ov.querySelector('#yes').onclick=()=>{S=fresh();closeModal();render()};
  });
}

/* ===================== ГАЙД ===================== */
function guideRows(){
  const rows=[];let acc=0,n=0;
  const fmt=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
  const push=(r)=>{acc+=r.d;rows.push({...r,n:++n,acc:fmt(acc)})};
  push({st:'Знакомство',text:'Согласие и запись. '+CONSENT_TEXT+(S.consentExtra.length?' '+S.consentExtra.join('. ')+'.':''),d:2,pr:'must',h:'',p:''});
  STAGES.forEach(st=>{
    realItems(st.id).forEach((it,k)=>{
      let pr=k===0?'must':'can';
      if(it.cut)pr='cut';
      if(st.id==='h2'&&S.k7req&&it.card==='К7')pr='must';
      push({st:st.name,text:it.text,d:itemMins(it),pr,h:it.hyp,p:it.probes.map(p=>p.text).join(' / ')});
    });
  });
  const reserve=S.limit-acc;
  return {rows,reserve,fmt,acc};
}
const PRN={must:'● ОБЯЗАТЕЛЬНО',can:'○ МОЖНО СОКРАТИТЬ',cut:'■ ОТСЕКАЮЩИЙ'};
function renderGuide(){
  const {rows,reserve,fmt}=guideRows();
  app.innerHTML=`${demoBar()}
  <header class="top"><div><div class="eyebrow">Готовый гайд · ${esc(CASE.title)}</div><h1>Ваш сценарий за ${S.limit} минут</h1>
  <p class="rq">Исследовательский вопрос: <b>${esc(CASE.rq)}</b></p></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" id="back">Вернуться к канвасу</button><button class="btn accent" id="copy">Скопировать для Excel</button></div></header>
  <div class="tablewrap"><table><thead><tr><th>№</th><th>Этап</th><th>Что говорит модератор</th><th>Длит., мин</th><th>Накоп.</th><th>Приоритет</th><th>Гипотеза</th><th>Пробы</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td class="num">${r.n}</td><td>${esc(r.st)}</td><td>${esc(r.text)}</td><td class="num">${r.d}</td><td class="num">${r.acc}</td><td><span class="pr ${r.pr}">${PRN[r.pr]}</span></td><td>${esc(r.h)}</td><td>${esc(r.p)}</td></tr>`).join('')}
  <tr><td></td><td>Резерв</td><td>Углубление в важные темы, вопросы по ходу</td><td class="num">${reserve}</td><td class="num">${fmt(S.limit)}</td><td></td><td></td><td></td></tr>
  </tbody></table></div>
  <section class="panel"><div class="eyebrow">Что дальше</div>
  <p style="margin:0;max-width:70ch">Вставьте таблицу в Excel или Google Таблицы: кнопка копирует её с разделителями колонок. Сравните свои формулировки с эталонами и проведите пилотное интервью: после первого разговора гайд обычно правят.</p>
  <div id="fallback"></div>
  <div><button class="btn ghost" id="again">Сыграть ещё раз</button></div></section>${FOOT}`;
  bindDemoBar();
  document.getElementById('back').onclick=()=>{S.screen='game';render()};
  document.getElementById('again').onclick=()=>{S=fresh();S.screen='game';render();openConsent()};
  document.getElementById('copy').onclick=()=>{
    const head=['№','Этап','Что говорит модератор','Длит., мин','Накоп.','Приоритет','Гипотеза','Пробы'];
    const clean=s=>String(s).replace(/[\t\n]/g,' ');
    const tsv=[head.join('\t')].concat(rows.map(r=>[r.n,r.st,r.text,r.d,r.acc,PRN[r.pr],r.h,r.p].map(clean).join('\t'))).concat(['\tРезерв\tУглубление в важные темы\t'+reserve+'\t'+fmt(S.limit)+'\t\t\t']).join('\n');
    const fb=()=>{const f=document.getElementById('fallback');f.innerHTML='<p style="margin:0;font-size:14px">Скопируйте текст вручную:</p><textarea class="copyfall" id="fbta" readonly></textarea>';const t=document.getElementById('fbta');t.value=tsv;t.select()};
    try{navigator.clipboard.writeText(tsv).then(()=>toast('Таблица скопирована. Вставьте её в Excel'),fb)}catch(e){fb()}
  };
}

/* ===================== ДЕМО И ЭКСКУРСИЯ ===================== */
let saved=null;
function demoState(){
  const st=fresh();st.demo=true;st.screen='game';st.consent=[true,true,true,true];st.consentDone=true;st.opened=6;st.active='h1';
  st.rolls={intro:3,vvod:4,h1:5,h2:1,h3:3,fin:5};st.caseLog=['С8'];st.deck=st.deck.filter(x=>x!=='С8');st.flipped={'Г1':true};
  const q=(stage,card,probes)=>{const c=green(card);return{uid:uid(),stage,card,text:c.e.replace(/^«|»$/g,'').replace(/» Перед.*$/,''),min:c.min,hyp:stage.startsWith('h')?{h1:'Г1',h2:'Г2',h3:'Г3'}[stage]:'',probes:(probes||[]).map(([id,t])=>({card:id,text:t})),cut:!!c.cut}};
  st.items=[q('intro','З1'),q('intro','З4'),q('vvod','В1'),q('vvod','В3'),
    q('h1','К1',[['П11','Почему именно история?']]),q('h1','К6',[['П6','А последний раз как было?']]),
    q('h2','К2',[['П8','Не видят?']]),q('h2','К7',[['П3','А что было после этого?']]),
    q('h3','К8',[['П7','Покажите, где вы это делали']]),q('h3','К9',[['П9','Что вы имели в виду под «неудобно»?']]),
    q('fin','Зк1')];
  return st;
}
function startDemo(){saved=S.demo?saved:S;S=demoState();render();window.scrollTo(0,0);startTour()}
function exitDemo(toGame){endTour();S=saved||fresh();saved=null;if(toGame){S=fresh();S.screen='game'}render();window.scrollTo(0,0);if(toGame)openConsent()}
function demoBar(){return S.demo?`<div class="demobar"><span><b>Демо.</b> Пример собранного гайда по эталонам. Ваш прогресс не затронут.</span><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small ghost" data-tour>Экскурсия</button><button class="btn small accent" data-play>Начать свою партию</button><button class="btn small ghost" data-exit>Выйти из демо</button></span></div>`:''}
function bindDemoBar(){
  app.querySelectorAll('[data-tour]').forEach(b=>b.onclick=()=>{if(S.screen!=='game'){S.screen='game';render()}startTour()});
  app.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>exitDemo(true));
  app.querySelectorAll('[data-exit]').forEach(b=>b.onclick=()=>exitDemo(false));
}
const TOUR=[
  {sel:'.rq',t:'Исследовательский вопрос',d:'Партия начинается с вопроса, на который должно ответить интервью. Всё, что не помогает на него ответить, в гайд не попадает.'},
  {sel:'.meter',t:'Лимит 60 минут',d:'Каждая карта стоит минут. Счётчик показывает длину сценария, штриховка в конце — резерв 5 минут. Карта, которая не влезает, не кладётся.'},
  {sel:'.stage[data-stage="intro"] .consent',t:'Сначала согласие',d:'Канвас закрыт, пока игрок не отметит 4 пункта информированного согласия. Исследование начинается только после него.'},
  {sel:'.side .panel',t:'Кубик в начале каждого этапа',d:'Нечет — спокойный этап. Чёт — карта случая: плохой вопрос, который надо исправить, или вводная от заказчика с выбором ответа. В демо на вводных выпала 4 и вводная «Добавьте вопрос про цены» — правильный ответ: отказать.'},
  {sel:'.lib',t:'Библиотека карт-формул',d:'Игрок выбирает карту, пишет свой вопрос под кейс, проходит самопроверку и сравнивает с эталоном опытного исследователя. Только после этого вопрос ложится на канвас.'},
  {sel:'.stage[data-stage="h1"]',t:'Цепочки гипотез',d:'Карта гипотезы переворачивается: видно, из какого факта она выросла и что её подтвердит. В цепочке 2 ключевых вопроса, у каждого жёлтая проба. Следующая гипотеза открывается, когда цепочка собрана.'},
  {sel:'.side .panel:nth-child(2)',t:'Чек-лист вместо очков',d:'Программа проверяет гайд: согласие, покрытие гипотез, пробы, заключение, резерв, вопросы вне цели. Когда всё зелёное, можно собрать гайд.'},
  {sel:'#build',t:'Готовый гайд',d:'Канвас превращается в таблицу: этап, вопрос, длительность, накопительное время, приоритет, гипотеза, пробы. Её можно скопировать в Excel.',last:true}
];
let tourI=-1;
function startTour(){tourI=0;showTour()}
function endTour(){tourI=-1;document.querySelectorAll('.tour-hl').forEach(e=>e.classList.remove('tour-hl'));const t=document.getElementById('tour');if(t)t.remove()}
function showTour(){
  document.querySelectorAll('.tour-hl').forEach(e=>e.classList.remove('tour-hl'));
  const step=TOUR[tourI];const el=document.querySelector(step.sel);
  if(el){el.classList.add('tour-hl');el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'})}
  let box=document.getElementById('tour');if(!box){box=document.createElement('div');box.id='tour';box.className='tour';box.setAttribute('role','dialog');document.body.appendChild(box)}
  box.innerHTML=`<div class="eyebrow">Экскурсия · ${tourI+1} из ${TOUR.length}</div><h3>${esc(step.t)}</h3><p>${esc(step.d)}</p>
  <div class="mfoot"><button class="btn ghost small" id="tx">Закрыть</button>${tourI?'<button class="btn ghost small" id="tp">Назад</button>':''}${step.last?'<button class="btn accent small" id="tg">Показать гайд</button>':'<button class="btn accent small" id="tn">Далее</button>'}</div>`;
  box.querySelector('#tx').onclick=endTour;
  const tp=box.querySelector('#tp');if(tp)tp.onclick=()=>{tourI--;showTour()};
  const tn=box.querySelector('#tn');if(tn){tn.onclick=()=>{tourI++;showTour()};tn.focus()}
  const tg=box.querySelector('#tg');if(tg){tg.onclick=()=>{endTour();S.screen='guide';render();window.scrollTo(0,0)};tg.focus()}
}

/* ===================== ПРОЧЕЕ ===================== */
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

function start(data){if(data&&data.S)S=data.S;render();if(S.screen==='game'&&!S.consentDone)openConsent();else if(S.screen==='game'&&S.pendingCase)openCase(S.pendingCase)}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
